
name: WA Autoatendimento V12

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar projeto WA V12
        run: |
          mkdir -p wa_autoatendimento
          unzip -o WA_Autoatendimento_v12.zip -d wa_autoatendimento
          echo "Projeto WA preparado"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          cd wa_autoatendimento
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-Autoatendimento-V12-APK
          path: wa_autoatendimento/app/build/outputs/apk/debug/app-debug.apk
