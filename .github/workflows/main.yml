name: Gerar APK WA Autoatendimento V16.2.7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair projeto corrigido V16.2.7
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find "$GITHUB_WORKSPACE" -type f -iname 'WA_Autoatendimento_V16_2_7_SELETOR_SONS_CORRIGIDO.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "::error::Envie o ZIP WA_Autoatendimento_V16_2_7_SELETOR_SONS_CORRIGIDO.zip para a raiz do repositório."
            find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort | head -100
            exit 1
          fi
          BUILD_ROOT="$RUNNER_TEMP/wa-v1627"
          mkdir -p "$BUILD_ROOT"
          unzip -oq "$ZIP" -d "$BUILD_ROOT"
          SETTINGS="$(find "$BUILD_ROOT" -type f -name settings.gradle -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle não encontrado dentro do ZIP."
            find "$BUILD_ROOT" -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/java/com/autoatendimento/app/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/java/com/autoatendimento/app/WhatsAppNotificationService.java"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto V16.2.7 corrigido localizado."

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --console=plain clean assembleDebug 2>&1 | tee "$RUNNER_TEMP/wa-v1627-build.log"

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Autoatendimento-V16.2.7-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar log se a compilação falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Autoatendimento-V16.2.7-log
          path: ${{ runner.temp }}/wa-v1627-build.log
          if-no-files-found: warn
          retention-days: 7
