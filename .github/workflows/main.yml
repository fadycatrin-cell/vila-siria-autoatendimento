name: Gerar APK WA Autoatendimento V16.2.7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair projeto V16.2.7
        shell: bash
        run: |
          set -euo pipefail

          echo "Arquivos ZIP encontrados no repositorio:"
          find . -type f -iname '*.zip' -not -path './.git/*' -print

          ZIP=""
          if [ -f "./WA_Autoatendimento_V16_2_7_SELETOR_SONS_CORRIGIDO.zip" ]; then
            ZIP="./WA_Autoatendimento_V16_2_7_SELETOR_SONS_CORRIGIDO.zip"
          else
            ZIP="$(find . -type f -iname 'WA_Autoatendimento_V16_2_7_SELETOR_SONS*.zip' -not -path './.git/*' -print | sort | head -n 1)"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP V16.2.7 encontrado."
            exit 1
          fi

          echo "Usando pacote: $ZIP"
          mkdir -p "$RUNNER_TEMP/projeto-v1627"
          unzip -oq "$ZIP" -d "$RUNNER_TEMP/projeto-v1627"

          PROJECT=""
          while IFS= read -r SETTINGS; do
            CANDIDATE="$(dirname "$SETTINGS")"
            if [ -f "$CANDIDATE/app/build.gradle" ]; then
              PROJECT="$CANDIDATE"
              break
            fi
          done < <(find "$RUNNER_TEMP/projeto-v1627" -type f -name settings.gradle -not -path '*/.gradle/*')

          if [ -z "$PROJECT" ]; then
            echo "ERRO: não encontrei settings.gradle junto de app/build.gradle."
            find "$RUNNER_TEMP/projeto-v1627" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "Projeto Android encontrado em: $PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK e mostrar erro completo
        shell: bash
        run: |
          set -uo pipefail
          cd "$PROJECT_DIR"
          set +e
          gradle --no-daemon assembleDebug --stacktrace --info 2>&1 | tee "$RUNNER_TEMP/compilacao.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          if [ "$RESULT" -ne 0 ]; then
            echo "COMPILAÇÃO FALHOU. Erros relevantes:"
            grep -n -B 4 -A 8 -E 'error:|What went wrong:|Could not|FAILURE:' "$RUNNER_TEMP/compilacao.log" | tail -160 || true
            exit "$RESULT"
          fi

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Autoatendimento-V16.2.7-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar log completo se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-compilacao-v16.2.7
          path: ${{ runner.temp }}/compilacao.log
          if-no-files-found: ignore
          retention-days: 7
