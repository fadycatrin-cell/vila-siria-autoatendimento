
name: WA Autoatendimento V14 - Compilacao corrigida

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto V14
        run: |
          set -e
          test -f WA_Autoatendimento_V14_Corrigido_Gerador.zip
          mkdir -p wa_autoatendimento
          unzip -oq WA_Autoatendimento_V14_Corrigido_Gerador.zip -d wa_autoatendimento
          test -f wa_autoatendimento/app/src/main/java/com/autoatendimento/app/WhatsAppNotificationService.java

      - name: Corrigir expressao regular Java
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path(
              "wa_autoatendimento/app/src/main/java/com/autoatendimento/app/WhatsAppNotificationService.java"
          )
          source = p.read_text(encoding="utf-8")

          source = source.replace(r"(\s|$)", r"([ ]|$)")

          p.write_text(source, encoding="utf-8")
          print("Ajuste da expressao regular aplicado.")
          PY

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          cd wa_autoatendimento
          gradle --no-daemon assembleDebug

      - name: Verificar APK
        run: |
          test -s wa_autoatendimento/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-Autoatendimento-V14-APK
          path: wa_autoatendimento/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
