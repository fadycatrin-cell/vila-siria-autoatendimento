
name: WA Autoatendimento V14

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Extrair projeto corrigido
        run: |
          set -e
          unzip -t WA_Autoatendimento_V14_FINAL_CORRIGIDO.zip
          mkdir -p wa_autoatendimento
          unzip -oq WA_Autoatendimento_V14_FINAL_CORRIGIDO.zip -d wa_autoatendimento

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          cd wa_autoatendimento
          gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-Autoatendimento-V14-APK
          path: wa_autoatendimento/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
