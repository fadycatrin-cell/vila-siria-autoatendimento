name: VS Autoatendimento V11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Preparar projeto VS Autoatendimento V11
        run: |
          mkdir vs_autoatendimento
          unzip -o VS_Autoatendimento_v11.zip -d vs_autoatendimento
          cd vs_autoatendimento
          echo "Projeto VS Autoatendimento V11 preparado"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK VS Autoatendimento V11
        run: |
          cd vs_autoatendimento
          gradle assembleDebug

      - name: Disponibilizar APK VS Autoatendimento V11
        uses: actions/upload-artifact@v4
        with:
          name: VS-Autoatendimento-V11-APK
          path: vs_autoatendimento/app/build/outputs/apk/debug/app-debug.apk
