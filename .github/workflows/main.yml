name: Gerar APK WA Autoatendimento V16.2.7

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerar-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e extrair projeto V16.2.7
        shell: bash
        run: |
          set -euo pipefail
          ZIP="WA_Autoatendimento_V16_2_7_SELETOR_SONS.zip"
          test -f "$ZIP" || { echo "ERRO: ZIP não encontrado: $ZIP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/projeto-v1627"
          unzip -oq "$ZIP" -d "$RUNNER_TEMP/projeto-v1627"
          PROJECT="$RUNNER_TEMP/projeto-v1627"
          test -f "$PROJECT/settings.gradle" || { echo "ERRO: settings.gradle ausente na raiz do ZIP"; find "$PROJECT" -maxdepth 4 -type f | head -100; exit 1; }
          test -f "$PROJECT/app/build.gradle" || { echo "ERRO: app/build.gradle ausente"; exit 1; }
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar e mostrar erros Java completos
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"
          gradle --no-daemon --console=plain clean assembleDebug --stacktrace --info 2>&1 | tee "$RUNNER_TEMP/build.log"
          STATUS=${PIPESTATUS[0]}
          echo ""
          echo "========== DIAGNÓSTICO JAVA =========="
          echo 'Capturando diagnóstico do compilador acima.'
          if [ "$STATUS" -ne 0 ]; then
            grep -n -B 4 -A 8 -E 'error:|cannot find symbol|illegal start|reached end of file|does not override|incompatible types|package .* does not exist|symbol:' "$RUNNER_TEMP/build.log" || true
            exit "$STATUS"
          fi

      - name: Disponibilizar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Autoatendimento-V16.2.7-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Disponibilizar log de compilação se falhar
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: WA-V16.2.7-log-de-compilacao
          path: ${{ runner.temp }}/build.log
          if-no-files-found: warn
          retention-days: 7
