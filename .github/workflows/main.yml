
name: WA Autoatendimento V14 - Gerador corrigido

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Conferir projeto V14
        run: |
          test -f WA_Autoatendimento_V14_Corrigido_Gerador.zip
          unzip -t WA_Autoatendimento_V14_Corrigido_Gerador.zip

      - name: Extrair projeto original corrigido
        run: |
          mkdir -p wa_autoatendimento
          unzip -oq WA_Autoatendimento_V14_Corrigido_Gerador.zip \
            -d wa_autoatendimento
          test -f wa_autoatendimento/settings.gradle
          test -f wa_autoatendimento/app/build.gradle

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          cd wa_autoatendimento
          gradle --no-daemon assembleDebug

      - name: Verificar APK
        run: |
          test -s wa_autoatendimento/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-Autoatendimento-V14-APK
          path: wa_autoatendimento/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
